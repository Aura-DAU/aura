[pytest]
# rootdir was already server/rag by auto-detection, so this file only registers
# markers — it deliberately sets no addopts/testpaths, to keep the CI invocation
# in .github/workflows/ci.yml the single source of truth for what runs.
markers =
    integration: needs a real external service (live LLM endpoint, real API key). Self-skips when its credential is absent; deselect with -m "not integration".
