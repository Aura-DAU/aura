# AURA production stack — Phase E (DO-5)
#
# Full parity with the system-architecture doc's target design:
#   - `nginx`    — edge reverse proxy + SSL termination
#   - `aura`     — Next.js frontend (BFF route handlers + PWA)
#   - `backend`  — FastAPI + RAG pipeline. Orchestration is a LangGraph
#                  StateGraph (pipeline/aura_chat_graph.py); every LLM call
#                  routes through InferenceRouter to the vLLM pool below.
#   - `qdrant`   — self-hosted vector DB (doc §10), replacing Pinecone
#   - `vllm-node1/2/3` — self-hosted OpenAI-compatible inference servers
#                  (doc §14–16), replacing Groq's hosted API. Three nodes,
#                  one GPU each, matching the doc's 3x RTX-4090 pool —
#                  InferenceRouter treats VLLM_ENDPOINTS as a flat list and
#                  load-balances/fails over across however many you list.
#   - `postgres` — AUTH_DB_URL: auth schema, latency logs, admin bindings
#   - `redis`    — timetable push-notification queue / rate limiting
#
# GPU note: the vllm-node* services below assume the host has NVIDIA GPUs
# and the NVIDIA Container Toolkit installed (`nvidia-ctk runtime configure
# --runtime=docker`). Adjust `device_ids` to match your actual GPU indices,
# and drop nodes 2/3 (and their VLLM_ENDPOINTS entry) if you only have one
# GPU — InferenceRouter works fine with a single-node pool.
#
# Usage:
#   cp deploy/.env.prod.example deploy/.env.prod   # fill in secrets
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - aura
      - backend
    networks:
      - aura-edge

  aura:
    build:
      context: ../aura
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_URL: http://backend:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      INTERNAL_RESOLVE_SECRET: ${INTERNAL_RESOLVE_SECRET}
    depends_on:
      - backend
    networks:
      - aura-edge
      - aura-internal

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: ${BACKEND_WORKERS:-2}
      AUTH_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      PROD_FRONTEND_ORIGIN: ${PROD_FRONTEND_ORIGIN}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      INTERNAL_RESOLVE_SECRET: ${INTERNAL_RESOLVE_SECRET}
      # Self-hosted inference pool (pipeline/inference_router.py) — see the
      # vllm-node* services below. Add/remove entries to match how many
      # nodes you're actually running.
      VLLM_ENDPOINTS: http://vllm-node1:8000/v1,http://vllm-node2:8000/v1,http://vllm-node3:8000/v1
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      # Self-hosted vector DB (pipeline/retrieval/qdrant_client.py)
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-aura-knowledge-base}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET}
      GOOGLE_CALENDAR_VAULT_KEY: ${GOOGLE_CALENDAR_VAULT_KEY}
      GOOGLE_CALENDAR_VAULT_DB: /var/lib/aura/google_calendar_vault.db
      ECAMPUS_VAULT_KEY: ${ECAMPUS_VAULT_KEY}
      ECAMPUS_VAULT_DB: /var/lib/aura/ecampus_credentials.db
      ECAMPUS_TIMETABLE_POOL_DB: /var/lib/aura/timetable_pool.db
      AURA_AUDIT_LOG: /var/log/aura/personal_data_audit.log
    volumes:
      # Raw markdown knowledge base — mounted read-only so the /documents
      # endpoint (Phase C citation side-drawer) can serve source files, and
      # so ingestion scripts (upload_to_qdrant.py etc.) can be run inside
      # the container ad hoc.
      - ../data:/app/data:ro
      - aura-vault:/var/lib/aura
      - aura-logs:/var/log/aura
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - aura-internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aura-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - aura-internal

  # ── Vector DB (architecture doc §10) ─────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - aura-internal

  # ── Inference pool (architecture doc §14–16) ─────────────────────────
  # Three nodes for parity with the doc's "3x RTX 4090" pool. Each serves
  # the same model — InferenceRouter (pipeline/inference_router.py) is what
  # implements the doc's "Inference Router" (least-loaded selection,
  # failover, hides topology from the orchestrator), not this compose file.
  vllm-node1:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}", "--port", "8000", "--enable-prefix-caching"]
    expose:
      - "8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - aura-internal

  vllm-node2:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}", "--port", "8000", "--enable-prefix-caching"]
    expose:
      - "8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    networks:
      - aura-internal

  vllm-node3:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}", "--port", "8000", "--enable-prefix-caching"]
    expose:
      - "8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    networks:
      - aura-internal

  # ── Observability (architecture doc's containerization table:
  #    aura-prometheus / aura-grafana, also shown on Node 1 in the
  #    hardware diagram). Previously entirely absent — no /metrics
  #    endpoint existed anywhere in the backend. server/api/metrics.py
  #    now exposes request counts, /chat stage latencies (guardrail /
  #    retrieval / generation, matching §Understanding the Critical
  #    Path), and per-vLLM-node dispatch/failure counts from
  #    InferenceRouter. Neither service is reachable from aura-edge —
  #    Prometheus scrapes container-to-container, and Grafana is exposed
  #    only on the internal network here; add an nginx location block
  #    (with its own auth) if you want it reachable from outside the host.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    depends_on:
      - backend
    networks:
      - aura-internal

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - aura-internal

networks:
  aura-edge:
  aura-internal:

volumes:
  postgres-data:
  redis-data:
  aura-vault:
  aura-logs:
  qdrant-storage:
  vllm-cache:
  prometheus-data:
  grafana-data:
