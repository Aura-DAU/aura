version: '3.8'

services:
  frontend:
    build:
      context: ../aura
      dockerfile: Dockerfile.prod
    container_name: dau_pwa_frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - NODE_ENV=production
      # Any required runtime env vars go here
      # - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile.prod
    container_name: dau_pwa_backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      # Any required runtime env vars go here
      - ENV=production
