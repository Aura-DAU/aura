# AURA Distributed Cluster — Prometheus Scrape Configuration (Node 4)
# Scrapes across Node 1 (Gateway/Backend), Node 2 (vLLM 1), Node 3 (vLLM 2), and Node 4 (Qdrant & Embedding/Reranker)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Node 1: FastAPI Gateway & LangGraph Orchestrator
  - job_name: "node1-gateway-backend"
    static_configs:
      - targets: ["<NODE_1_IP>:8000"]

  # Node 2 & Node 3: vLLM OpenAI GPU Inference Engines
  - job_name: "vllm-inference-nodes"
    static_configs:
      - targets:
          - "<NODE_2_IP>:8000"
          - "<NODE_3_IP>:8000"
        labels:
          pool: "inference"

  # Node 4: Local Embedding & Reranker Microservice
  - job_name: "node4-embedding-reranker"
    metrics_path: /health
    static_configs:
      - targets: ["embedding-reranker:8001"]

  # Node 4: Local Qdrant Vector Store
  - job_name: "node4-qdrant"
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]
