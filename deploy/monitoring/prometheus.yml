# Prometheus scrape config — architecture doc's aura-prometheus service.
#
# Scrapes:
#   - backend:8000/metrics    — FastAPI request + /chat stage-latency metrics
#                               (server/api/metrics.py), including per-node
#                               inference dispatch/failure counts recorded
#                               by InferenceRouter.
#   - vllm-node{1,2,3}:8000/metrics — vLLM's built-in OpenAI-server metrics
#                               (GPU KV-cache usage, running/waiting request
#                               counts, token throughput) — this is what lets
#                               Grafana show the doc's "NVIDIA GPU Inference
#                               Pool" utilization directly, not just the
#                               request counts wrapping it.
#
# Postgres/Redis/Qdrant are intentionally not scraped here — none are
# exposed with a Prometheus exporter in this deployment. Add
# prometheus-community/postgres_exporter, redis_exporter, and Qdrant's own
# /metrics (Qdrant exposes one natively at :6333/metrics) as follow-ups if
# database-level dashboards are needed later; wiring is additive.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "aura-backend"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "vllm-nodes"
    static_configs:
      - targets:
          - "vllm-node1:8000"
          - "vllm-node2:8000"
          - "vllm-node3:8000"
        labels:
          pool: "inference"

  - job_name: "qdrant"
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]
