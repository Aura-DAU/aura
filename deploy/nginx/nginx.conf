# AURA edge reverse proxy — Multi-Node NGINX Configuration (Node 1)
#
# Terminates TLS, routes /api/chat, /api/speech, /api/documents through `aura` (Next.js PWA),
# and provides direct access to FastAPI `backend` at /backend/.

worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;  # hide nginx version in Server header and error pages
    sendfile      on;
    keepalive_timeout 65;

    # NextAuth + our RBAC/internal-JWT cookies can exceed nginx's 4x8k default
    # header buffer, which makes nginx itself return "400 Bad Request" before
    # the request ever reaches Next.js — on EVERY request that carries the
    # cookie, including static assets like /manifest.json. Give headers room.
    large_client_header_buffers 4 16k;
    client_header_buffer_size 4k;

    # Slowloris / slow-body: drop stalled clients before they pin workers.
    client_header_timeout 12s;
    client_body_timeout 12s;
    send_timeout 30s;
    reset_timedout_connection on;

    # Default body cap — oversized only on /api/speech (audio). JSON APIs stay small.
    client_max_body_size 1m;

    # Chat responses stream as SSE (text/event-stream) — never buffer/gzip them.
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_proxied any;

    # Access logging. Keep writing to stdout (Docker logs → GoAccess live
    # dashboard) AND to a file parsed by prometheus-nginxlog-exporter. The
    # `aura_metrics` format adds $request_time so the exporter can build a
    # latency histogram — its `format` in deploy/monitoring/nginxlog-exporter.hcl
    # MUST stay byte-for-byte identical to this log_format.
    log_format aura_metrics '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /dev/stdout combined;
    access_log /var/log/nginx/aura_metrics.log aura_metrics;

    # Per-IP request rate zones
    limit_req_zone $binary_remote_addr zone=aura_api:10m rate=20r/s;
    # Stricter limit for credential / ERP-login endpoints (anti credential-stuffing).
    limit_req_zone $binary_remote_addr zone=aura_auth:10m rate=5r/s;
    # LLM / RAG — expensive; keep burst small.
    limit_req_zone $binary_remote_addr zone=aura_chat:10m rate=5r/s;
    # Whisper / ffmpeg — CPU-heavy; very tight.
    limit_req_zone $binary_remote_addr zone=aura_heavy:10m rate=2r/s;

    # Concurrent connection caps (complements limit_req for slowloris / flood).
    limit_conn_zone $binary_remote_addr zone=aura_addr:10m;

    limit_req_status 429;
    limit_conn_status 429;

    upstream aura_frontend {
        server aura:3000;
        keepalive 32;
    }

    upstream aura_backend {
        server backend:8000;
        keepalive 32;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name _;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS edge
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        # Forward-secret, AEAD-only suite (Mozilla intermediate). TLSv1.3 suites negotiate automatically.
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), geolocation=(), usb=(), payment=(), microphone=(self)" always;

        # Global per-IP connection budget for this vhost.
        limit_conn aura_addr 40;

        # Internal-only FastAPI endpoints must never be reachable from the public
        # edge. Design intent (identity_routes.py): /internal/* is network-restricted
        # to the Next.js server; the secret header is only defense-in-depth. Return
        # 404 so the path's existence is not revealed. Longest-prefix match ensures
        # these win over the generic /backend/ block below.
        location /backend/internal { deny all; return 404; }
        # /metrics is unauthenticated (Prometheus scrapes it over the private network,
        # not via this edge) — do not expose it publicly.
        location /backend/metrics { deny all; return 404; }

        # Direct access to the FastAPI backend
        location /backend/ {
            limit_req zone=aura_api burst=20 nodelay;
            limit_conn aura_addr 20;
            client_max_body_size 1m;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_pass http://aura_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Streamed chat responses (SSE) — expensive RAG/LLM path.
        location /api/chat {
            limit_req zone=aura_chat burst=8 nodelay;
            limit_conn aura_addr 8;
            # ChatRequest (server/api/schemas.py) allows up to 20 history
            # turns x 20,000 chars each — a legitimate request body can
            # reach several hundred KB. 64k silently 413'd/400'd any chat
            # with a long-enough conversation before it ever reached
            # Next.js; 1m gives headroom above the schema's real max.
            client_max_body_size 1m;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_pass http://aura_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
        }

        # Whisper / ffmpeg transcription — CPU-bound; tight rate + conn + body.
        location /api/speech {
            limit_req zone=aura_heavy burst=4 nodelay;
            limit_conn aura_addr 4;
            client_max_body_size 25m;
            client_body_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
            proxy_pass http://aura_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # NextAuth + credential / ERP-login proxies — stricter rate limit to blunt
        # credential stuffing / OAuth abuse. Same upstream as the catch-all below.
        location /api/auth {
            limit_req zone=aura_auth burst=10 nodelay;
            limit_conn aura_addr 10;
            client_max_body_size 64k;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://aura_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ecampus {
            limit_req zone=aura_auth burst=10 nodelay;
            limit_conn aura_addr 10;
            client_max_body_size 64k;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://aura_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else goes to Next.js PWA
        location / {
            limit_req zone=aura_api burst=40 nodelay;
            client_max_body_size 1m;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_pass http://aura_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
