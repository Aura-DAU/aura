# AURA edge reverse proxy — Multi-Node NGINX Configuration (Node 1)
#
# Terminates TLS, routes /api/chat, /api/speech, /api/documents through `aura` (Next.js PWA),
# and provides direct access to FastAPI `backend` at /backend/.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Chat responses stream as SSE (text/event-stream) — never buffer/gzip them.
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_proxied any;

    limit_req_zone $binary_remote_addr zone=aura_api:10m rate=20r/s;

    upstream aura_frontend {
        server aura:3000;
        keepalive 32;
    }

    upstream aura_backend {
        server backend:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS edge ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 25m;  # /api/speech accepts audio uploads up to 25MB

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Direct access to the FastAPI backend
        location /backend/ {
            limit_req zone=aura_api burst=40 nodelay;
            proxy_pass http://aura_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Streamed chat responses (SSE)
        location /api/chat {
            limit_req zone=aura_api burst=20 nodelay;
            proxy_pass http://aura_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
        }

        # Everything else goes to Next.js PWA
        location / {
            limit_req zone=aura_api burst=40 nodelay;
            proxy_pass http://aura_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
