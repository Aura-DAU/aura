name: CI workflow

on:
  push:
    branches: [pwa-demo, main]
  pull_request:
    branches: [pwa-demo, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint · types · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aura

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match local / lockfile generation (pnpm 10 workspace settings).
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: aura/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          NEXTAUTH_SECRET: ci-nextauth-secret
          INTERNAL_JWT_SECRET: ci-internal-jwt-secret
          INTERNAL_RESOLVE_SECRET: ci-internal-resolve-secret
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          BACKEND_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/rag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/rag/requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Unit tests
        # Lightweight unit suite — skip modules that need full RAG stack
        # (Pinecone / torch / missing workflow tool packages).
        run: >
          pytest pipeline/tests
          -q
          --tb=short
          --ignore=pipeline/tests/test_dls_pipeline.py
          --ignore=pipeline/tests/test_ingestion_metadata.py
          --ignore=pipeline/tests/test_composite_tools.py
          --ignore=pipeline/tests/test_scholarship_tools.py
          --ignore=pipeline/tests/test_write_tool_removal.py
        env:
          INTERNAL_JWT_SECRET: test-internal-secret-for-auth-middleware
          INTERNAL_RESOLVE_SECRET: test-resolve-secret
          PYTHONPATH: ${{ github.workspace }}/server:${{ github.workspace }}/server/rag
