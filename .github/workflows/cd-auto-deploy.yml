# CD workflow for Aura app + Node 4 monitoring deploy (from Node 1)

name: CD — Aura app deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch or tag)"
        required: true
        default: "main"
        type: string
      target:
        description: "What to deploy"
        required: true
        default: apps
        type: choice
        options:
          - apps
          - node4
          - both
  push:
    branches: [main]
    paths:
      - "aura/**"
      - "server/**"
      - "deploy/node1/**"
      - "deploy/scripts/deploy-apps.sh"
      - "deploy/nginx/**"
      - "deploy/node4/**"
      - "deploy/monitoring/**"
      - "deploy/scripts/deploy-node4.sh"
      - "deploy/scripts/lib/**"
      - "deploy/scripts/deploy-cluster.sh"
      - ".github/workflows/cd-auto-deploy.yml"

permissions:
  contents: read

jobs:
  # ── Node 1: aura + backend + nginx ──────────────────────────────────────
  deploy-apps:
    name: Deploy aura + backend (aura-node1)
    runs-on: [self-hosted, Linux, aura-node1]
    timeout-minutes: 45
    concurrency:
      group: cd-gateway-node1-app-deploy
      cancel-in-progress: false
    steps:
      - name: Pull ref and detect whether apps need deploy
        id: plan
        env:
          AURA_APP_ROOT: /opt/aura/app
          GITHUB_TOKEN: ${{ secrets.AURA_DEPLOY_GIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          REF="${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}"
          cd "${AURA_APP_ROOT}"
          git -c "url.https://x-access-token:${GITHUB_TOKEN}@github.com/.insteadOf=https://github.com/" \
            fetch --prune origin
          git checkout "${REF}"
          git -c "url.https://x-access-token:${GITHUB_TOKEN}@github.com/.insteadOf=https://github.com/" \
            pull --ff-only origin "${REF}"
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"

          should_deploy=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.target }}" in
              apps|both) should_deploy=true ;;
            esac
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [[ "${BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
              should_deploy=true
            else
              if git diff --name-only "${BEFORE}" "${AFTER}" | grep -E \
                '^(aura/|server/|deploy/node1/|deploy/scripts/deploy-apps\.sh|deploy/nginx/|\.github/workflows/cd-auto-deploy\.yml)' \
                >/dev/null; then
                should_deploy=true
              fi
            fi
          fi
          echo "deploy=${should_deploy}" >> "${GITHUB_OUTPUT}"
          echo "apps deploy=${should_deploy} ref=${REF}"

      - name: Deploy application containers only
        if: steps.plan.outputs.deploy == 'true'
        env:
          AURA_APP_ROOT: /opt/aura/app
          AURA_ENV_FILE: /opt/aura/app/deploy/node1/.env
          GITHUB_TOKEN: ${{ secrets.AURA_DEPLOY_GIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          chmod +x "${AURA_APP_ROOT}/deploy/scripts/deploy-apps.sh"
          "${AURA_APP_ROOT}/deploy/scripts/deploy-apps.sh" "${{ steps.plan.outputs.ref }}"

      - name: Skip apps deploy
        if: steps.plan.outputs.deploy != 'true'
        run: echo "No Node 1 app path changes; skipping deploy-apps.sh"

  # ── Node 4: prometheus + grafana (rsync from Node 1) ────────────────────
  deploy-node4-monitoring:
    name: Deploy Node 4 monitoring (via aura-node1)
    runs-on: [self-hosted, Linux, aura-node1]
    timeout-minutes: 30
    concurrency:
      group: cd-gateway-node4-monitoring-deploy
      cancel-in-progress: false
    steps:
      - name: Pull ref and detect whether Node 4 needs deploy
        id: plan
        env:
          AURA_APP_ROOT: /opt/aura/app
          GITHUB_TOKEN: ${{ secrets.AURA_DEPLOY_GIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          REF="${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}"
          cd "${AURA_APP_ROOT}"
          git -c "url.https://x-access-token:${GITHUB_TOKEN}@github.com/.insteadOf=https://github.com/" \
            fetch --prune origin
          git checkout "${REF}"
          git -c "url.https://x-access-token:${GITHUB_TOKEN}@github.com/.insteadOf=https://github.com/" \
            pull --ff-only origin "${REF}"
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"

          should_deploy=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.target }}" in
              node4|both) should_deploy=true ;;
            esac
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [[ "${BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
              should_deploy=true
            else
              if git diff --name-only "${BEFORE}" "${AFTER}" | grep -E \
                '^(deploy/node4/|deploy/monitoring/|deploy/scripts/deploy-node4\.sh|deploy/scripts/lib/|deploy/scripts/deploy-cluster\.sh)' \
                >/dev/null; then
                should_deploy=true
              fi
            fi
          fi
          echo "deploy=${should_deploy}" >> "${GITHUB_OUTPUT}"
          echo "node4 deploy=${should_deploy} ref=${REF}"

      - name: Sync + recreate Prometheus/Grafana on Node 4
        if: steps.plan.outputs.deploy == 'true'
        env:
          AURA_APP_ROOT: /opt/aura/app
          AURA_ENV_FILE: /opt/aura/app/deploy/node1/.env
          # Optional override from GitHub Actions variables; else script reads node1/.env
          AURA_NODE4_HOST: ${{ vars.AURA_NODE4_HOST }}
          AURA_SSH_USER: ${{ vars.AURA_SSH_USER }}
          AURA_SSH_KEY: ${{ vars.AURA_SSH_KEY }}
        run: |
          set -euo pipefail
          chmod +x \
            "${AURA_APP_ROOT}/deploy/scripts/deploy-node4.sh" \
            "${AURA_APP_ROOT}/deploy/scripts/lib/remote.sh"
          # Host-local key is the primary auth path (never commit private keys).
          : "${AURA_SSH_KEY:=/opt/aura/.ssh/cluster_deploy}"
          export AURA_SSH_KEY
          "${AURA_APP_ROOT}/deploy/scripts/deploy-node4.sh"

      - name: Skip Node 4 deploy
        if: steps.plan.outputs.deploy != 'true'
        run: echo "No Node 4 / monitoring path changes; skipping deploy-node4.sh"
