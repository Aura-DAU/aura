# AURA Distributed Cluster — Node 3 (vLLM GPU Node 2)
# Services: vLLM OpenAI-Compatible API Engine
#
# See deploy/node2/docker-compose.yml for the note on MAX_MODEL_LEN=16384 and
# why --gpu-memory-utilization/--max-num-seqs are set explicitly below rather
# than left to vLLM's defaults.
#
# The --max-num-seqs default of 24 matches the live ceiling and KV reality
# (measured kv_cache_max_concurrency≈2.9 at max_model_len 8192); revisit upward
# only after a max_model_len cutover toward 4096.

services:
  vllm-node2:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command: [ "--model", "${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}", "--port", "8000", "--host", "0.0.0.0", "--enable-prefix-caching", "--max-model-len", "${MAX_MODEL_LEN:-16384}", "--gpu-memory-utilization", "${VLLM_GPU_MEM_UTIL:-0.92}", "--max-num-seqs", "${VLLM_MAX_NUM_SEQS:-24}" ]
    ports:
      - "8000:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks:
      - aura-vllm-net

networks:
  aura-vllm-net:

volumes:
  vllm-cache:
