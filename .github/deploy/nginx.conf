# AURA edge reverse proxy — Phase E (DO-5)
#
# Terminates TLS, routes /api/chat, /api/speech, /api/documents (and every
# other Next.js route handler that proxies to FastAPI) through the `aura`
# service, and gives the FastAPI `backend` its own path prefix for direct
# health checks / future non-proxied clients (mobile apps, LMS, ERP —
# per the architecture doc's "Web Portal / Mobile App / LMS / ERP" tier).
#
# Certificates: mount your fullchain.pem/privkey.pem into ./certs and update
# the paths below (e.g. via certbot's webroot or DNS-01 flow).

worker_processes auto;

events {
    # 1000 concurrent browsers need headroom beyond 1k (multi-worker).
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;  # hide nginx version in Server header and error pages
    sendfile      on;
    keepalive_timeout 65;

    # NextAuth + our RBAC/internal-JWT cookies can exceed nginx's 4x8k default
    # header buffer, which makes nginx itself return "400 Bad Request" before
    # the request ever reaches Next.js — on EVERY request that carries the
    # cookie, including static assets like /manifest.json. Give headers room.
    large_client_header_buffers 4 16k;
    client_header_buffer_size 4k;

    # Slowloris / slow-body: drop stalled clients before they pin workers.
    client_header_timeout 12s;
    client_body_timeout 12s;
    send_timeout 30s;
    reset_timedout_connection on;

    # Default body cap — oversized only on /api/speech (audio). JSON APIs stay small.
    client_max_body_size 1m;

    # Chat responses stream as SSE (text/event-stream) — never buffer/gzip them.
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_proxied any;

    # ── Admission keying (EDGE-01) ───────────────────────────────────────
    # A large share of students reach Aura from behind one campus NAT public
    # address, so `limit_conn $binary_remote_addr N` treats the whole campus
    # as a single client: the edge exhausts that one bucket and sheds real
    # users with an opaque 429 long before the backend's admission semaphore
    # can answer with a retryable 503.
    #
    # List the university's egress CIDR(s) here. Sources inside them get an
    # empty limit key on /api/chat, which disables the PER-SOURCE cap for
    # them — they are governed by the cluster-wide aura_chat_total guard
    # below instead. Left empty this block is a no-op: every source keeps
    # the per-source cap, so the config is safe to ship unconfigured.
    #
    # Only /api/chat honours this exemption, because /api/chat is the only
    # path with a global capacity guard to take over. Do not extend it to a
    # path that has no global ceiling.
    geo $aura_campus_net {
        default 0;
        # 203.0.113.0/24 1;   # ← replace with the verified campus NAT egress CIDR
    }

    # Empty string disables a limit for that request (nginx skips zero-length
    # keys), which is how the campus exemption is expressed. `default` fails
    # CLOSED — an unexpected geo value keeps the per-source cap rather than
    # silently exempting the source.
    map $aura_campus_net $aura_chat_key {
        default $binary_remote_addr;
        0       $binary_remote_addr;
        1       "";
    }

    # Constant key: every in-flight /api/chat connection lands in ONE bucket
    # regardless of source address. This is the limit that tracks real GPU /
    # backend capacity and the only one that behaves correctly behind NAT.
    map $host $aura_chat_all_key {
        default chat;
    }

    # Canonical websocket-aware Connection header (EDGE-02). The catch-all
    # location previously hardcoded `Connection: upgrade` on EVERY request,
    # which both sends a bogus header on ordinary page/asset requests and
    # defeats the upstream `keepalive` pool — nginx only reuses an upstream
    # connection when Connection is empty. Pass `upgrade` through only when
    # the client actually asked for it.
    map $http_upgrade $aura_connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ── Shed attribution (EDGE-01) ───────────────────────────────────────
    # An incident must be able to answer "which layer shed this request?".
    # $upstream_status is empty when nginx never reached an upstream — i.e.
    # the edge shed it; non-empty means the backend answered (quota 429 or
    # admission 503). Emitted as its own greppable `aura_shed` line so the
    # normal access log format stays untouched.
    map $upstream_status $aura_shed_layer {
        default backend;
        ""      edge;
    }
    map $status $aura_shed_logged {
        default 0;
        429     1;
        503     1;
    }
    log_format aura_shed 'aura_shed ts=$time_iso8601 shed_by=$aura_shed_layer '
                         'status=$status upstream_status="$upstream_status" '
                         'method=$request_method uri=$uri addr=$remote_addr '
                         'campus_net=$aura_campus_net rt=$request_time';
    access_log /dev/stdout combined;
    access_log /dev/stdout aura_shed if=$aura_shed_logged;

    # Per-IP request rate zones
    limit_req_zone $binary_remote_addr zone=aura_api:10m rate=20r/s;
    # Stricter limit for credential / ERP-login endpoints (anti credential-stuffing).
    limit_req_zone $binary_remote_addr zone=aura_auth:10m rate=5r/s;
    # LLM / RAG — expensive. Trust-aware key so campus NAT is not one bucket.
    limit_req_zone $aura_chat_key zone=aura_chat:10m rate=20r/s;
    # Whisper / ffmpeg — CPU-heavy; very tight.
    limit_req_zone $binary_remote_addr zone=aura_heavy:10m rate=2r/s;

    # Concurrent connection caps (complements limit_req for slowloris / flood).
    limit_conn_zone $binary_remote_addr zone=aura_addr:10m;
    # /api/chat per-source abuse ceiling — trust-aware (campus exempt).
    limit_conn_zone $aura_chat_key zone=aura_chat_conn:10m;
    # /api/chat cluster capacity guard — one bucket for every source.
    limit_conn_zone $aura_chat_all_key zone=aura_chat_total:1m;

    # 429 (not the 503 default) so an edge shed is never confused with the
    # backend's admission 503. Do not "simplify" these back to 503.
    limit_req_status 429;
    limit_conn_status 429;

    upstream aura_frontend {
        server aura:3000;
        keepalive 128;
    }

    upstream aura_backend {
        server backend:8000;
        keepalive 128;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS edge ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        # Forward-secret, AEAD-only suite (Mozilla intermediate). TLSv1.3 suites negotiate automatically.
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), geolocation=(), usb=(), payment=(), microphone=(self)" always;

        # Per-IP connection budget for this vhost — ABUSE control, not capacity
        # control. Campus NAT puts many students behind one public address, so
        # 40 was shedding real users with 429 before backend admission could
        # answer 503 + Retry-After; 256 is NAT-tolerant while still bounding a
        # single flooding host. /api/chat declares its own limits and therefore
        # does not inherit this one — see that block for the capacity guard.
        limit_conn aura_addr 256;

        # nginx's bare 429 page gives a student nothing to act on. Route edge
        # sheds through @aura_shed (Retry-After + JSON). Must live in this
        # server block so the named location resolves. Upstream 429/503 are
        # NOT intercepted (proxy_intercept_errors is off by default), so a
        # backend quota-429 or admission-503 still reaches the client verbatim.
        error_page 429 = @aura_shed;

        # Edge load-shed response. Reached only via `error_page 429` above.
        # nginx re-enters location matching for the internal redirect but the
        # limit modules are already accounted for this request, so the limits
        # inherited here cannot re-trigger.
        location @aura_shed {
            # add_header does NOT merge across configuration levels: declaring
            # any add_header here would drop the server-level security headers
            # for this response, so they are repeated verbatim.
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header Permissions-Policy "camera=(), geolocation=(), usb=(), payment=(), microphone=(self)" always;
            add_header Retry-After "5" always;
            add_header Cache-Control "no-store" always;
            # Lets an operator (and the frontend) tell an edge shed apart from
            # the backend's admission 503 / quota 429 without reading logs.
            add_header X-Aura-Shed-By "edge" always;
            default_type application/json;
            return 429 '{"detail":"Aura is busy right now. Please retry in a few seconds.","code":"EDGE_OVERLOADED","shedBy":"edge","retryAfter":5}';
        }

        # Internal-only FastAPI endpoints must never be reachable from the public
        # edge. Design intent (identity_routes.py): /internal/* is network-restricted
        # to the Next.js server; the secret header is only defense-in-depth. Return
        # 404 so the path's existence is not revealed. Longest-prefix match ensures
        # these win over the generic /backend/ block below.
        location /backend/internal { deny all; return 404; }
        # /metrics is unauthenticated (Prometheus scrapes it over the private network,
        # not via this edge) — do not expose it publicly.
        location /backend/metrics { deny all; return 404; }

        # Direct access to the FastAPI backend, for non-browser clients
        # (LMS/ERP integrations, health checks) that don't need the Next.js
        # BFF layer. Browser traffic should keep using /api/* below, which
        # goes through Next.js for auth/session handling.
        location /backend/ {
            limit_req zone=aura_api burst=20 nodelay;
            limit_conn aura_addr 128;
            client_max_body_size 1m;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_pass http://aura_backend/;
            proxy_http_version 1.1;
            # See /api/chat — required for `keepalive 128` on aura_backend to
            # take effect; nginx defaults this header to `close`.
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Streamed chat responses (SSE) — expensive RAG/LLM path.
        location /api/chat {
            # EDGE-01. Three limits, three distinct jobs:
            #
            #  1. aura_chat_total — cluster capacity guard. One bucket for all
            #     sources, so it is NAT-correct by construction. This is the
            #     real ceiling; it exists so the per-source caps below can be
            #     loosened for campus without exposing the cluster.
            #  2. aura_chat_conn  — per-source concurrent-connection ceiling,
            #     kept for abuse control only, at a NAT-tolerant threshold.
            #  3. aura_chat (req) — per-source arrival rate, same trust-aware
            #     key, so a single host cannot spray asks.
            #
            # A location-level limit_conn REPLACES the server-level
            # `limit_conn aura_addr 256` (nginx inherits limit_conn only when
            # the current level declares none), so these are the whole story
            # for /api/chat.
            #
            # Sizing: the edge must admit somewhat MORE than the backend can
            # hold, so that overload is shed by backend admission (503 +
            # Retry-After, attributable, tunable) rather than at the edge.
            # Backend capacity per replica = CHAT_CONCURRENCY x BACKEND_WORKERS,
            # which should itself be sized against the live per-node
            # `num_requests_running` ceiling x healthy endpoint count — NOT
            # against a compose default, which does not currently match the
            # live nodes (see ISSUES GPU-05 / VLLM_MAX_NUM_SEQS). At the
            # ~96-admitted/replica setting this config was validated for, 192
            # leaves roughly one queue-depth of headroom above admission.
            # Re-check this number whenever CHAT_CONCURRENCY changes.
            limit_conn aura_chat_total 192;
            limit_conn aura_chat_conn 128;
            limit_req zone=aura_chat burst=64 nodelay;
            # ChatRequest (server/api/schemas.py) allows up to 20 history
            # turns x 20,000 chars each — a legitimate request body can
            # reach several hundred KB. 64k silently 413'd/400'd any chat
            # with a long-enough conversation before it ever reached
            # Next.js; 1m gives headroom above the schema's real max.
            client_max_body_size 1m;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_pass http://aura_frontend;
            proxy_http_version 1.1;
            # Required for the upstream `keepalive` pool to be used at all:
            # nginx's built-in default is `Connection: close`, which closes the
            # upstream connection after every request and makes EDGE-02's
            # `keepalive 128` a no-op. Must NOT be set on the catch-all
            # location, which needs Connection: upgrade for websockets.
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            # Must stay ABOVE the backend's own per-call LLM read timeout
            # (VLLM_READ_TIMEOUT, now 120s) plus retrieval/guardrail time. The
            # window at risk is before the first token, when no SSE bytes flow:
            # if nginx times out first it severs the connection and Chrome
            # reports ERR_HTTP2_PROTOCOL_ERROR, whereas letting the backend
            # time out yields a clean SSE error event the client can render.
            proxy_read_timeout 180s;
            # Client-facing write timeout — must be raised here too. The global
            # send_timeout 30s (see http{} block above) governs nginx-to-BROWSER
            # writes, separate from proxy_read/send_timeout above (nginx-to-upstream).
            # Left at the 30s default, nginx killed the client connection whenever
            # the RAG/LLM backend went >30s between SSE writes, which Chrome surfaces
            # as ERR_HTTP2_PROTOCOL_ERROR instead of a clean timeout.
            send_timeout 180s;
        }

        # Whisper / ffmpeg transcription — CPU-bound; tight rate + conn + body.
        location /api/speech {
            limit_req zone=aura_heavy burst=4 nodelay;
            limit_conn aura_addr 4;
            client_max_body_size 25m;
            client_body_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
            proxy_pass http://aura_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # NextAuth + credential / ERP-login proxies — stricter rate limit to blunt
        # credential stuffing / OAuth abuse. Same upstream as the catch-all below.
        location /api/auth {
            limit_req zone=aura_auth burst=10 nodelay;
            limit_conn aura_addr 10;
            client_max_body_size 64k;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://aura_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ecampus {
            limit_req zone=aura_auth burst=10 nodelay;
            limit_conn aura_addr 10;
            client_max_body_size 64k;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://aura_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else (pages, other API routes, static assets, PWA
        # manifest/service worker) goes to Next.js.
        location / {
            limit_req zone=aura_api burst=40 nodelay;
            client_max_body_size 1m;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_pass http://aura_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            # Empty unless the client sent Upgrade — see $aura_connection_upgrade.
            proxy_set_header Connection $aura_connection_upgrade;
        }
    }
}
