# AURA Distributed Cluster — Prometheus Scrape Configuration (Node 4)
# Scrapes across Node 1 (Gateway/Backend), Node 2 (vLLM 1), Node 3 (vLLM 2), and Node 4 (Qdrant & Embedding/Reranker)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Node 1: FastAPI Gateway & LangGraph Orchestrator
  - job_name: "node1-gateway-backend"
    static_configs:
      - targets: ["10.100.97.71:8000"]

  # Node 1: NGINX Edge Proxy (prometheus-nginxlog-exporter)
  - job_name: "node1-nginx-edge"
    static_configs:
      - targets: ["10.100.97.71:9113"]

  # Node 2 & Node 3: vLLM Open Source Qwen GPU Inference Engines
  - job_name: "vllm-inference-nodes"
    static_configs:
      - targets:
          - "10.100.97.72:8000"
          - "10.100.97.73:8000"
        labels:
          pool: "inference"

  # Host Hardware Telemetry (Node Exporter)
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "10.100.97.71:9100"
          - "10.100.97.72:9100"
          - "10.100.97.73:9100"
          - "10.100.97.74:9100"

  # NVIDIA GPU Telemetry (DCGM Exporter)
  - job_name: "dcgm-exporter"
    static_configs:
      - targets:
          - "10.100.97.72:9400"
          - "10.100.97.73:9400"

  # Node 4: Local Embedding & Reranker Microservice
  - job_name: "node4-embedding-reranker"
    metrics_path: /metrics
    static_configs:
      - targets: ["embedding-reranker:8001"]

  # Node 4: Local Qdrant Vector Store
  - job_name: "node4-qdrant"
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]
