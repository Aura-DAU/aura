# Auto-provisions dashboard JSON files from /etc/grafana/provisioning/dashboards
apiVersion: 1

providers:
  - name: 'AURA Dashboards'
    orgId: 1
    folder: 'AURA Monitoring'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards
