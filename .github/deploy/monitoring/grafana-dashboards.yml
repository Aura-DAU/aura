# Auto-provisions dashboard JSON files from /etc/grafana/dashboards
# (provider YAML mounts separately under provisioning/dashboards/ — do not
# bind-mount the JSON dir onto the same path or Docker hits ROFS nesting).
apiVersion: 1

providers:
  - name: 'AURA Dashboards'
    orgId: 1
    folder: 'AURA Monitoring'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/dashboards
