# AURA Prometheus scrape configuration
#
# Scrapes all containers from the PDF architecture:
#   aura-backend    FastAPI gateway (/metrics via prometheus-fastapi-instrumentator)
#   aura-embedding  Embedding service (/health as up/down probe)
#   aura-reranker   Cross-Encoder service (/health)
#   aura-vllm-*     vLLM OpenAI-compatible servers (/metrics built-in)
#   aura-qdrant     Qdrant vector DB (/metrics built-in)
#   prometheus      self-monitoring
#   grafana         self-monitoring
#
# To expose FastAPI /metrics, add to server/requirements.txt:
#   prometheus-fastapi-instrumentator>=6.0.0
# And add to server/api/api.py:
#   from prometheus_fastapi_instrumentator import Instrumentator
#   Instrumentator().instrument(app).expose(app)

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

scrape_configs:

  # ── FastAPI backend ─────────────────────────────────────────────────────
  - job_name: "aura-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  # ── Embedding service ───────────────────────────────────────────────────
  - job_name: "aura-embedding"
    static_configs:
      - targets: ["embedding:8000"]
    metrics_path: /health   # no /metrics yet — used as up/down probe

  # ── Reranker service ────────────────────────────────────────────────────
  - job_name: "aura-reranker"
    static_configs:
      - targets: ["reranker:8001"]
    metrics_path: /health

  # ── vLLM inference nodes ────────────────────────────────────────────────
  # vLLM exposes Prometheus metrics at /metrics natively since v0.4.x
  - job_name: "aura-vllm-node1"
    static_configs:
      - targets: ["vllm-node1:8080"]
    metrics_path: /metrics

  - job_name: "aura-vllm-node2"
    static_configs:
      - targets: ["vllm-node2:8080"]
    metrics_path: /metrics

  - job_name: "aura-vllm-node3"
    static_configs:
      - targets: ["vllm-node3:8080"]
    metrics_path: /metrics

  # ── Qdrant ─────────────────────────────────────────────────────────────
  - job_name: "aura-qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics

  # ── Self-monitoring ─────────────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: /metrics
