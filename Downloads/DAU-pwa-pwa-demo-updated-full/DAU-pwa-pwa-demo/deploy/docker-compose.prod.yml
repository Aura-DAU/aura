# AURA production stack — complete container map per System Architecture PDF
#
# Architecture PDF container table (Page 12-13):
#   aura-nginx        NGINX reverse proxy + SSL termination
#   aura-api          Next.js frontend (BFF) + PWA
#   aura-backend      FastAPI gateway + RAG orchestrator (LangGraph equivalent)
#   aura-redis        Conversation memory + rate-limit store
#   aura-postgres     Persistent auth / audit / analytics DB
#   aura-qdrant       Vector database (self-hosted — replaces managed Pinecone)
#   aura-embedding    Embedding generation service (BAAI/bge-base-en-v1.5)
#   aura-reranker     Cross-Encoder re-ranking service (BAAI/bge-reranker-v2-m3)
#   aura-vllm-node1   vLLM inference server — Node 1 (RTX 4090)
#   aura-vllm-node2   vLLM inference server — Node 2 (RTX 4090)
#   aura-vllm-node3   vLLM inference server — Node 3 (RTX 4090)
#   aura-prometheus   Metrics collection
#   aura-grafana      Metrics dashboard
#
# CURRENT STATE (Groq + Pinecone fallback):
#   The embedding, reranker, qdrant, and vllm services are the target
#   architecture. While PINECONE_API_KEY and GROQ_API_KEY are set in .env.prod,
#   the backend uses managed cloud services and the four local services below
#   can be commented out or skipped with Docker profiles.
#
#   To activate local services:
#     docker compose --profile local-ai up -d
#   To use only the cloud fallback:
#     docker compose up -d          (without --profile local-ai)
#
# Usage:
#   cp deploy/.env.prod.example deploy/.env.prod   # fill in secrets
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod \
#     --profile local-ai up -d --build

services:

  # ── Edge ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: aura-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - aura
      - backend
    networks:
      - aura-edge

  # ── Frontend (Next.js BFF + PWA) ─────────────────────────────────────────
  aura:
    build:
      context: ../aura
      dockerfile: Dockerfile
    container_name: aura-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_URL: http://backend:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      INTERNAL_RESOLVE_SECRET: ${INTERNAL_RESOLVE_SECRET}
    depends_on:
      - backend
    networks:
      - aura-edge
      - aura-internal

  # ── FastAPI Gateway + RAG Orchestrator ───────────────────────────────────
  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: aura-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: ${BACKEND_WORKERS:-2}
      AUTH_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      PROD_FRONTEND_ORIGIN: ${PROD_FRONTEND_ORIGIN}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      INTERNAL_RESOLVE_SECRET: ${INTERNAL_RESOLVE_SECRET}
      # ── Inference: Groq cloud (default) or vLLM nodes (local-ai profile)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      VLLM_ENDPOINT_1: ${VLLM_ENDPOINT_1:-}
      VLLM_ENDPOINT_2: ${VLLM_ENDPOINT_2:-}
      VLLM_ENDPOINT_3: ${VLLM_ENDPOINT_3:-}
      # ── Retrieval: Pinecone cloud (default) or Qdrant local (local-ai profile)
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX: ${PINECONE_INDEX:-}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-aura_chunks}
      # ── Retrieval microservices (local-ai profile)
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-http://embedding:8000}
      RERANKER_SERVICE_URL: ${RERANKER_SERVICE_URL:-http://reranker:8001}
      # ── Google Calendar
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET}
      GOOGLE_CALENDAR_VAULT_KEY: ${GOOGLE_CALENDAR_VAULT_KEY}
      GOOGLE_CALENDAR_VAULT_DB: /var/lib/aura/google_calendar_vault.db
      ECAMPUS_TIMETABLE_POOL_DB: /var/lib/aura/timetable_pool.db
      AURA_AUDIT_LOG: /var/log/aura/personal_data_audit.log
    volumes:
      - ../data:/app/data:ro
      - aura-vault:/var/lib/aura
      - aura-logs:/var/log/aura
    depends_on:
      - postgres
      - redis
    networks:
      - aura-internal

  # ── Persistent Storage ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aura-internal

  redis:
    image: redis:7-alpine
    container_name: aura-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - aura-internal

  # ── Vector Database (self-hosted Qdrant — local-ai profile) ───────────────
  # PDF Section 10: "Vector Database (Qdrant)"
  # Currently Pinecone is used via managed API. Uncomment --profile local-ai
  # and set QDRANT_HOST=qdrant to migrate. Run the ingestion script inside
  # the backend container to populate Qdrant:
  #   docker exec aura-backend python rag/pipeline/ingestion/sync_incremental.py
  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: aura-qdrant
    restart: unless-stopped
    profiles: ["local-ai"]
    expose:
      - "6333"   # HTTP REST
      - "6334"   # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - aura-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Retrieval AI Services (Node 4 — RTX 5080) ─────────────────────────────
  # PDF Section 9: "Embedding Generation Service"
  # PDF Section 11: "Cross-Encoder Re-ranking Service"
  # Both services run on Node 4 which carries the RTX 5080 for retrieval AI.
  # The backend falls back to inline model loading when these URLs are unset.
  embedding:
    build:
      context: ../services/embedding
      dockerfile: Dockerfile
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
    container_name: aura-embedding
    restart: unless-stopped
    profiles: ["local-ai"]
    expose:
      - "8000"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cuda}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - aura-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  reranker:
    build:
      context: ../services/reranker
      dockerfile: Dockerfile
      args:
        RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
    container_name: aura-reranker
    restart: unless-stopped
    profiles: ["local-ai"]
    expose:
      - "8001"
    environment:
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - aura-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── vLLM Inference Servers (Nodes 1-3 — RTX 4090) ────────────────────────
  # PDF Sections 14-15: "LLM Inference Servers" + "vLLM Inference Engine"
  # Three independent vLLM containers, one per GPU node.
  # The InferenceRouter (server/api/inference_router.py) routes to these via:
  #   VLLM_ENDPOINT_1=http://vllm-node1:8080/v1
  #   VLLM_ENDPOINT_2=http://vllm-node2:8080/v1
  #   VLLM_ENDPOINT_3=http://vllm-node3:8080/v1
  #
  # Model: configured via VLLM_MODEL env var (default: Qwen/Qwen3-32B-AWQ)
  # AWQ quantization allows Qwen3-32B to fit in 24 GB VRAM (RTX 4090).
  vllm-node1:
    image: vllm/vllm-openai:v0.5.4
    container_name: aura-vllm-node1
    restart: unless-stopped
    profiles: ["local-ai"]
    expose:
      - "8080"
    command:
      - "--model=${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}"
      - "--quantization=awq"
      - "--max-model-len=${VLLM_MAX_MODEL_LEN:-8192}"
      - "--gpu-memory-utilization=${VLLM_GPU_UTIL:-0.92}"
      - "--host=0.0.0.0"
      - "--port=8080"
      - "--served-model-name=aura-llm"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - vllm-model-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_NODE1_GPU_ID:-0}"]
              capabilities: [gpu]
    networks:
      - aura-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s   # model load takes ~2 min

  vllm-node2:
    image: vllm/vllm-openai:v0.5.4
    container_name: aura-vllm-node2
    restart: unless-stopped
    profiles: ["local-ai"]
    expose:
      - "8080"
    command:
      - "--model=${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}"
      - "--quantization=awq"
      - "--max-model-len=${VLLM_MAX_MODEL_LEN:-8192}"
      - "--gpu-memory-utilization=${VLLM_GPU_UTIL:-0.92}"
      - "--host=0.0.0.0"
      - "--port=8080"
      - "--served-model-name=aura-llm"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - vllm-model-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_NODE2_GPU_ID:-1}"]
              capabilities: [gpu]
    networks:
      - aura-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  vllm-node3:
    image: vllm/vllm-openai:v0.5.4
    container_name: aura-vllm-node3
    restart: unless-stopped
    profiles: ["local-ai"]
    expose:
      - "8080"
    command:
      - "--model=${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}"
      - "--quantization=awq"
      - "--max-model-len=${VLLM_MAX_MODEL_LEN:-8192}"
      - "--gpu-memory-utilization=${VLLM_GPU_UTIL:-0.92}"
      - "--host=0.0.0.0"
      - "--port=8080"
      - "--served-model-name=aura-llm"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - vllm-model-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_NODE3_GPU_ID:-2}"]
              capabilities: [gpu]
    networks:
      - aura-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

  # ── Monitoring Stack ──────────────────────────────────────────────────────
  # PDF Section 3 container table: aura-prometheus + aura-grafana
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: aura-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    networks:
      - aura-internal
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.4.2
    container_name: aura-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_SERVER_ROOT_URL:         ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    ports:
      - "3001:3000"   # host:3001 — avoids conflict with Next.js :3000
    networks:
      - aura-internal
    depends_on:
      - prometheus


networks:
  aura-edge:       # nginx ↔ frontend (internet-facing)
  aura-internal:   # all backend services (no external exposure)


volumes:
  postgres-data:
  redis-data:
  qdrant-storage:
  aura-vault:
  aura-logs:
  vllm-model-cache:    # shared across all three vllm nodes for faster re-use
  prometheus-data:
  grafana-data:
